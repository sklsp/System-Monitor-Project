name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # the dashboard is built for Windows (pywin32, WMI temperatures), so it is tested there
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
